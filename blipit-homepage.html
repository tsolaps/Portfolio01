<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blipit — Find ad spaces across Nigeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #000000;
            --pink-hover: #2b2b2b;
            --black: #0C0C0A;
            --dark: #0C0C0A;
            --gray: rgba(12, 12, 10, 0.52);
            --light-gray: rgba(12, 12, 10, 0.08);
            --bg: #F0F0EE;
            --white: #FFFFFF;
            --radius-pill: 999px;
            --shadow-soft: 0 4px 24px rgba(12, 12, 10, 0.06);
            --shadow-focus: 0 12px 32px rgba(12, 12, 10, 0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            height: 80px;
            padding: 0 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .navbar-link {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.15s;
        }

        .navbar-link:hover {
            color: var(--pink);
        }

        .navbar-cta {
            background: linear-gradient(90deg, #000000 0%, #2b2b2b 100%);
            color: var(--white);
            border: none;
            border-radius: 999px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .navbar-cta:hover {
            opacity: 0.92;
        }

        .navbar-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--dark);
        }

        .navbar-menu-btn svg {
            display: block;
        }

        /* Account dropdown */
        .account-dropdown-wrapper {
            position: relative;
        }

        .account-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            background: var(--white);
            border: 1px solid var(--light-gray);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-width: 260px;
            padding: 12px 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 200;
        }

        .account-dropdown.open {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .account-dropdown a,
        .account-dropdown button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 400;
            color: var(--dark);
            text-decoration: none;
            background: none;
            border: none;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.1s;
        }

        .account-dropdown a:hover,
        .account-dropdown button:hover {
            background: #f5f5f5;
        }

        .account-dropdown .dropdown-divider {
            height: 1px;
            background: var(--light-gray);
            margin: 8px 0;
        }

        .account-dropdown .dropdown-promo {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-dropdown .dropdown-promo-img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #f0f0f0;
            flex-shrink: 0;
            overflow: hidden;
        }

        .account-dropdown .dropdown-promo-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-dropdown .dropdown-promo-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            line-height: 1.3;
        }

        .account-dropdown .dropdown-promo-sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--gray);
        }

        .account-dropdown .dropdown-sign {
            font-weight: 600;
            color: var(--pink);
        }

        /* ==================== SEARCH SECTION ==================== */
        .search-section {
            padding: 24px 80px;
        }

        .search-pill {
            display: flex;
            align-items: center;
            height: 66px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .search-pill:focus-within {
            box-shadow: var(--shadow-focus);
            transform: translateY(-2px);
        }

        .search-segment {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 20px;
            cursor: text;
            position: relative;
            min-height: 56px;
        }

        .search-segment+.search-segment::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 32px;
            width: 1px;
            background: var(--light-gray);
        }

        .search-segment-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.2;
        }

        .search-segment-placeholder {
            font-size: 14px;
            color: var(--gray);
            line-height: 1.2;
            margin-top: 2px;
        }

        .search-segment input,
        .search-segment select {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .search-btn {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(90deg, #000000 0%, #2b2b2b 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 7px;
            transition: background 0.15s;
        }

        .search-btn:hover {
            opacity: 0.92;
        }

        .search-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--white);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Location dropdown */
        .location-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--white);
            border: 1px solid var(--light-gray);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 8px 0;
            display: none;
            z-index: 50;
        }

        .location-dropdown.open {
            display: block;
        }

        .location-dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--dark);
            transition: background 0.1s;
        }

        .location-dropdown-item:hover {
            background: #f5f5f5;
        }

        .location-dropdown-item svg {
            width: 16px;
            height: 16px;
            stroke: var(--gray);
            fill: none;
            stroke-width: 1.8;
            flex-shrink: 0;
        }

        .location-dropdown-item .loc-rank {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray);
            width: 16px;
        }

        /* ==================== CATEGORY ROW ==================== */
        .category-section {
            padding: 0 80px 24px;
        }

        .category-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0;
        }

        .category-row::-webkit-scrollbar {
            display: none;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            cursor: pointer;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            opacity: 0.65;
            transition: opacity 0.2s, border-color 0.2s;
            flex-shrink: 0;
            font-family: inherit;
        }

        .category-item:hover {
            opacity: 1;
        }

        .category-item.active {
            opacity: 1;
            border-bottom-color: var(--pink);
        }

        .category-item svg {
            width: 24px;
            height: 24px;
            stroke: var(--dark);
            fill: none;
            stroke-width: 1.5;
        }

        .category-item-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
        }

        /* ==================== RESULTS COUNT ==================== */
        .results-section {
            padding: 16px 80px;
        }

        .results-count {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray);
        }

        /* ==================== LISTING GRID ==================== */
        .listings-section {
            padding: 0 80px 80px;
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .listing-card {
            background: rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--light-gray);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .listing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 32px rgba(12, 12, 10, 0.08);
        }

        .listing-card-image {
            position: relative;
            aspect-ratio: 4 / 3;
            background: #e8e8e8;
            overflow: hidden;
        }

        .listing-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .listing-card-save {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.15s;
        }

        .listing-card-save:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }

        .listing-card-save svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--dark);
            stroke-width: 2;
        }

        .listing-card-save.saved svg {
            fill: var(--pink);
            stroke: var(--pink);
        }

        .listing-card-body {
            padding: 14px 16px 16px;
        }

        .listing-card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .listing-card-location {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .listing-card-price {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
        }

        .listing-card-price span {
            font-weight: 400;
            color: var(--gray);
        }

        .listing-card-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 13px;
            color: var(--gray);
        }

        .listing-card-rating svg {
            width: 14px;
            height: 14px;
            fill: #f59e0b;
            stroke: #f59e0b;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .navbar {
                padding: 0 24px;
            }

            .search-section {
                padding: 24px 24px;
            }

            .category-section {
                padding: 0 24px 24px;
            }

            .results-section {
                padding: 16px 24px;
            }

            .listings-section {
                padding: 0 24px 80px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                height: 64px;
                padding: 0 16px;
            }

            .navbar-link {
                display: none;
            }

            .navbar-cta {
                display: none;
            }

            .navbar-menu-btn {
                display: flex;
            }

            .navbar-right.guest .navbar-link,
            .navbar-right.guest .navbar-cta {
                display: none;
            }

            .search-section {
                padding: 16px 16px;
            }

            .search-pill {
                height: 56px;
                border-radius: 28px;
            }

            .search-segment {
                padding: 0 14px;
                min-height: 48px;
            }

            .search-segment-label {
                font-size: 10px;
            }

            .search-segment-placeholder {
                font-size: 12px;
            }

            .search-btn {
                width: 42px;
                height: 42px;
                margin-right: 5px;
            }

            .search-btn svg {
                width: 16px;
                height: 16px;
            }

            .category-section {
                padding: 0 16px 16px;
            }

            .results-section {
                padding: 12px 16px;
            }

            .listings-section {
                padding: 0 16px 60px;
            }

            .listings-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (min-width: 769px) {

            .navbar-right.guest .navbar-link,
            .navbar-right.guest .navbar-cta {
                display: flex;
            }

            .navbar-right.guest .navbar-menu-btn {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar">
        <a href="#" class="navbar-logo">blipit</a>

        <div class="navbar-right" id="navbarRight">
            <button class="navbar-link" onclick="document.querySelector('.search-pill input')?.focus()">Find
                Space</button>
            <button class="navbar-link account-trigger">List Your Space</button>

            <div class="account-dropdown-wrapper">
                <button class="navbar-link account-trigger" style="display:flex;align-items:center;gap:4px;">
                    Sign In
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>

                <div class="account-dropdown" id="accountDropdown">
                    <a href="#">Help & Support</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-promo">
                        <div class="dropdown-promo-img">
                            <img src="blipit.png" alt="" onerror="this.style.display='none'" />
                        </div>
                        <div>
                            <div class="dropdown-promo-text">Own a billboard or venue?</div>
                            <div class="dropdown-promo-sub">List your space and earn</div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-sign">Sign In</button>
                    <button class="dropdown-sign">Create Account</button>
                </div>
            </div>

            <button class="navbar-menu-btn" id="menuBtn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- ==================== SEARCH ==================== -->
    <section class="search-section">
        <div class="search-pill" id="searchPill">
            <!-- What -->
            <div class="search-segment" id="whatSegment">
                <div class="search-segment-label">What</div>
                <div class="search-segment-placeholder">Billboard, LED screen…</div>
                <input type="text" id="whatInput" autocomplete="off" />
            </div>

            <!-- Where -->
            <div class="search-segment" id="whereSegment" style="position:relative;">
                <div class="search-segment-label">Where</div>
                <div class="search-segment-placeholder" id="whereDisplay">Lagos</div>
                <input type="text" id="whereInput" autocomplete="off" />
                <div class="location-dropdown" id="locationDropdown">
                    <div class="location-dropdown-item" data-loc="Nearby">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" />
                            <circle cx="12" cy="9" r="2.5" />
                        </svg>
                        <span>Nearby</span>
                    </div>
                    <div class="location-dropdown-item" data-loc="Lagos"><span class="loc-rank">1</span> Lagos</div>
                    <div class="location-dropdown-item" data-loc="Abuja"><span class="loc-rank">2</span> Abuja</div>
                    <div class="location-dropdown-item" data-loc="Port Harcourt"><span class="loc-rank">3</span> Port
                        Harcourt</div>
                    <div class="location-dropdown-divider"
                        style="height:1px;background:var(--light-gray);margin:4px 0;"></div>
                    <div class="location-dropdown-item" data-loc="Recently searched"
                        style="font-weight:600;color:var(--gray);font-size:12px;pointer-events:none;">RECENTLY SEARCHED
                    </div>
                    <div class="location-dropdown-item" data-loc="Ikeja"><svg viewBox="0 0 24 24" style="opacity:0.4;">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" />
                            <circle cx="12" cy="9" r="2.5" />
                        </svg><span>Ikeja</span></div>
                    <div class="location-dropdown-item" data-loc="Victoria Island"><svg viewBox="0 0 24 24"
                            style="opacity:0.4;">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" />
                            <circle cx="12" cy="9" r="2.5" />
                        </svg><span>Victoria Island</span></div>
                </div>
            </div>

            <!-- Size -->
            <div class="search-segment">
                <div class="search-segment-label">Size</div>
                <div class="search-segment-placeholder">Any size</div>
                <select>
                    <option>Any size</option>
                    <option>Small</option>
                    <option>Medium</option>
                    <option>Large</option>
                </select>
            </div>

            <button class="search-btn" aria-label="Search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </button>
        </div>
    </section>

    <!-- ==================== CATEGORIES ==================== -->
    <section class="category-section">
        <div class="category-row" id="categoryRow">
            <button class="category-item active" data-cat="all">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                </svg>
                <span class="category-item-label">All</span>
            </button>
            <button class="category-item" data-cat="restaurants">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" />
                </svg>
                <span class="category-item-label">Restaurants</span>
            </button>
            <button class="category-item" data-cat="campus">
                <svg viewBox="0 0 24 24">
                    <path d="M22 10v6M2 10l10-7 10 7M6 6v14h12V6" />
                </svg>
                <span class="category-item-label">Campus</span>
            </button>
            <button class="category-item" data-cat="event-venues">
                <svg viewBox="0 0 24 24">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <span class="category-item-label">Event Venues</span>
            </button>
            <button class="category-item" data-cat="gyms">
                <svg viewBox="0 0 24 24">
                    <path d="M6.5 6.5L17.5 17.5M6.5 17.5L17.5 6.5" />
                    <rect x="2" y="9" width="5" height="6" rx="1" />
                    <rect x="17" y="9" width="5" height="6" rx="1" />
                    <line x1="7" y1="12" x2="17" y2="12" />
                </svg>
                <span class="category-item-label">Gyms</span>
            </button>
            <button class="category-item" data-cat="billboards">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="14" rx="2" />
                    <line x1="3" y1="17" x2="21" y2="17" />
                    <line x1="9" y1="17" x2="9" y2="21" />
                    <line x1="15" y1="17" x2="15" y2="21" />
                    <line x1="7" y1="21" x2="17" y2="21" />
                </svg>
                <span class="category-item-label">Billboards</span>
            </button>
        </div>
    </section>

    <!-- ==================== RESULTS COUNT ==================== -->
    <section class="results-section">
        <p class="results-count">34 spaces available across Nigeria</p>
    </section>

    <!-- ==================== LISTINGS ==================== -->
    <section class="listings-section">
        <div class="listings-grid" id="listingsGrid"></div>
    </section>

    <script>
        // ==================== DUMMY DATA ====================
        const SPACES = [
            { id: 1, title: "Lagos Island Billboard", location: "Lagos Island, Lagos", price: "₦450,000", category: "billboards", img: "billboard1.jpg", rating: 4.5 },
            { id: 2, title: "The Place Restaurant — UI", location: "Ibadan, Oyo", price: "₦180,000", category: "restaurants", img: "restaurant1.jpg" },
            { id: 3, title: "UNILAG Campus Board", location: "Akoka, Lagos", price: "₦95,000", category: "campus", img: "campus1.jpg", rating: 4.8 },
            { id: 4, title: "Landmark Event Centre", location: "Victoria Island, Lagos", price: "₦620,000", category: "event-venues", img: "event1.jpg", rating: 4.2 },
            { id: 5, title: "Ikeja City Mall LED", location: "Ikeja, Lagos", price: "₦380,000", category: "billboards", img: "billboard2.jpg" },
            { id: 6, title: "FitFam Gym — Lekki", location: "Lekki Phase 1, Lagos", price: "₦210,000", category: "gyms", img: "gym1.jpg", rating: 4.0 },
            { id: 7, title: "ABU Zaria Campus", location: "Zaria, Kaduna", price: "₦75,000", category: "campus", img: "campus2.jpg" },
            { id: 8, title: "Transcorp Hilton", location: "Abuja", price: "₦890,000", category: "event-venues", img: "event2.jpg", rating: 4.9 },
        ];

        // ==================== RENDER LISTINGS ====================
        function renderListings(category) {
            const grid = document.getElementById('listingsGrid');
            const filtered = category === 'all' ? SPACES : SPACES.filter(s => s.category === category);

            grid.innerHTML = filtered.map(space => `
        <div class="listing-card">
          <div class="listing-card-image">
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#e8e8e8;color:#aaa;font-size:13px;font-weight:600;">
              ${space.title.charAt(0)}
            </div>
            <button class="listing-card-save" onclick="event.stopPropagation();this.classList.toggle('saved')">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </button>
          </div>
          <div class="listing-card-body">
            <div class="listing-card-title">${space.title}</div>
            <div class="listing-card-location">${space.location}</div>
            <div class="listing-card-price">${space.price} <span>/month</span></div>
            ${space.rating ? `
              <div class="listing-card-rating">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                ${space.rating}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
        }

        // ==================== CATEGORY FILTER ====================
        document.querySelectorAll('.category-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderListings(btn.dataset.cat);
            });
        });

        // ==================== ACCOUNT DROPDOWN ====================
        document.querySelectorAll('.account-trigger').forEach(trigger => {
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('accountDropdown').classList.toggle('open');
            });
        });
        document.addEventListener('click', () => {
            document.getElementById('accountDropdown').classList.remove('open');
        });

        // ==================== LOCATION DROPDOWN ====================
        const whereInput = document.getElementById('whereInput');
        const whereDisplay = document.getElementById('whereDisplay');
        const locDropdown = document.getElementById('locationDropdown');

        whereInput.addEventListener('focus', () => locDropdown.classList.add('open'));
        whereInput.addEventListener('blur', () => setTimeout(() => locDropdown.classList.remove('open'), 200));
        locDropdown.querySelectorAll('.location-dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                const loc = item.dataset.loc || item.querySelector('span:last-child')?.textContent || item.textContent.trim();
                if (loc && !loc.startsWith('RECENTLY')) {
                    whereDisplay.textContent = loc;
                    whereInput.value = loc;
                    locDropdown.classList.remove('open');
                }
            });
        });

        // ==================== MOBILE MENU ====================
        document.getElementById('menuBtn')?.addEventListener('click', () => {
            document.getElementById('accountDropdown').classList.toggle('open');
        });

        // ==================== WHAT INPUT VISIBILITY ====================
        const whatSegment = document.getElementById('whatSegment');
        whatSegment.addEventListener('click', () => {
            const input = whatSegment.querySelector('input');
            input.focus();
            input.style.opacity = '1';
            input.style.position = 'static';
            input.style.height = 'auto';
            input.style.border = 'none';
            input.style.outline = 'none';
            input.style.fontSize = '14px';
            input.style.fontFamily = 'inherit';
            input.style.padding = '0';
            input.style.background = 'transparent';
            const placeholder = whatSegment.querySelector('.search-segment-placeholder');
            placeholder.style.display = 'none';
        });

        // ==================== INIT ====================
        renderListings('all');
    </script>
</body>

</html>
